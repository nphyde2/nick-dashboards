name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  administration: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Serve the site from the main branch root
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = { branch: "main", path: "/" };
            try {
              await github.rest.repos.getPages({ owner, repo });
              await github.rest.repos.updateInformationAboutPagesSite({
                owner,
                repo,
                build_type: "legacy",
                source,
              });
              core.info("Pages source set to main /");
            } catch (error) {
              if (error.status === 404) {
                await github.rest.repos.createPagesSite({
                  owner,
                  repo,
                  build_type: "legacy",
                  source,
                });
                core.info("Pages site created from main /");
              } else {
                throw error;
              }
            }
