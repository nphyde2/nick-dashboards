name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true
        with:
          enablement: true
      - name: Pages still needs a one-time setting
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is not enabled. The token cannot create the site (Resource not accessible by integration). In Settings, Pages, choose GitHub Actions, or Deploy from a branch: main and folder / (root). .nojekyll is already committed."
      - name: Leave git metadata out of the site artifact
        if: steps.pages.outcome == 'success'
        run: rm -rf .git
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outcome == 'success'
        with:
          path: .
      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v5
