name: Refresh sports snapshot

on:
  schedule:
    # Tuesday and Friday, 13:15 UTC (morning in America/Chicago).
    - cron: "15 13 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch ESPN and write data/sports.json
        run: python scripts/update_sports.py
      - name: Commit the snapshot
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sports.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot changes."
          else
            git commit -m "chore: refresh sports snapshot"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - id: pages
        uses: actions/configure-pages@v6
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        with:
          enablement: true
      - name: Leave git metadata out of the site artifact
        if: steps.commit.outputs.changed == 'true' && steps.pages.outcome == 'success'
        run: rm -rf .git
      - uses: actions/upload-pages-artifact@v5
        if: steps.commit.outputs.changed == 'true' && steps.pages.outcome == 'success'
        with:
          path: .
      - id: deployment
        if: steps.commit.outputs.changed == 'true' && steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v5
